<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes">
<title>Love & Partnership 360°</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif}
body{
 background:radial-gradient(circle at 50% 35%,#ff6b8a 0,#c9184a 35%,#590018 100%);
 color:#fff;display:flex;align-items:center;justify-content:center;
}
.bg-heart{position:fixed;bottom:-40px;font-size:25px;opacity:.8;animation:float 6s linear infinite;pointer-events:none}
@keyframes float{0%{transform:translateY(0) scale(.7) rotate(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-110vh) scale(1.5) rotate(25deg);opacity:0}}
#intro{
 position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;
 align-items:center;justify-content:center;text-align:center;
 background:radial-gradient(circle,#ff7894,#9e1239 65%,#430013);
 transition:opacity .8s,visibility .8s;
}
#intro.hide{opacity:0;visibility:hidden;pointer-events:none}
.bigheart{font-size:110px;animation:beat 1s infinite;filter:drop-shadow(0 10px 20px #300)}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.introtitle{font-family:Georgia,serif;font-size:30px;font-weight:bold;margin:12px}
.introsub{font-size:14px;opacity:.9;margin-bottom:20px}
.open{border:0;border-radius:30px;padding:13px 25px;background:#fff;color:#a30e3d;font-size:16px;font-weight:bold;box-shadow:0 8px 25px #3008}
.scene{width:94vw;height:82vh;perspective:1500px;display:flex;align-items:center;justify-content:center}
.card{width:min(78vw,390px);height:min(78vh,650px);position:relative;transform-style:preserve-3d;touch-action:none;user-select:none;cursor:grab;transition:transform .15s ease}
.card.drag{cursor:grabbing;transition:none}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 15px 40px #2208}
.face img{width:100%;height:100%;object-fit:contain;display:block}
.back{transform:rotateY(180deg)}
.controls{position:fixed;bottom:10px;left:0;right:0;text-align:center;z-index:10}
button.ctrl{border:0;border-radius:22px;padding:9px 12px;margin:3px;font-weight:bold}
.tip{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:#0009;padding:7px 11px;border-radius:20px;font-size:11px;z-index:10;white-space:nowrap}
</style>
</head>

<div class="controls">
 <button class="ctrl" onclick="rot+=180;draw()">❤️ Flip</button>
 <button class="ctrl" onclick="scale=Math.min(3,scale+.15);draw()">＋ Zoom</button>
 <button class="ctrl" onclick="scale=Math.max(.5,scale-.15);draw()">− Zoom</button>
 <button class="ctrl" onclick="rot=0;scale=1;draw()">Reset</button>
</div>

<script>
const card=document.getElementById('card');
let rot=0,scale=1,down=false,lastX=0,lastY=0;

function draw(){card.style.transform=`rotateY(${rot}deg) scale(${scale})`}

function openCard(){
 document.getElementById('intro').classList.add('hide');
 for(let i=0;i<18;i++){
   setTimeout(()=>{
     const h=document.createElement('div');
     h.className='bg-heart';
     h.textContent=['❤️','💗','💕','💖','💘'][Math.floor(Math.random()*5)];
     h.style.left=(Math.random()*100)+'vw';
     h.style.animationDuration=(4+Math.random()*4)+'s';
     h.style.fontSize=(18+Math.random()*30)+'px';
     document.getElementById('hearts').appendChild(h);
     setTimeout(()=>h.remove(),8500);
   },i*100);
 }
}

card.addEventListener('pointerdown',e=>{
 down=true;lastX=e.clientX;lastY=e.clientY;
 card.classList.add('drag');card.setPointerCapture(e.pointerId);
});
card.addEventListener('pointermove',e=>{
 if(!down)return;
 rot+=(e.clientX-lastX)*.75;
 scale=Math.max(.5,Math.min(3,scale-(e.clientY-lastY)*.004));
 lastX=e.clientX;lastY=e.clientY;draw();
});
card.addEventListener('pointerup',()=>{down=false;card.classList.remove('drag')});
card.addEventListener('pointercancel',()=>{down=false;card.classList.remove('drag')});
card.addEventListener('wheel',e=>{
 e.preventDefault();scale=Math.max(.5,Math.min(3,scale+(e.deltaY<0?.12:-.12)));draw();
},{passive:false});
draw();
</script>
